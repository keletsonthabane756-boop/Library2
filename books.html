<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books - Community Library</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <button class="menu-button" id="menuButton">
        ☰
    </button>

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">

            <div>
                <h2>Community</h2>
                <span>Library</span>
            </div>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-link">
                Dashboard
            </a>

            <a href="books.html" class="nav-link active">
                Books
            </a>

            <a href="transactions.html" class="nav-link">
                Transactions
            </a>

            <a href="users.html" class="nav-link">
                Users
            </a>

        </nav>

        <div class="sidebar-bottom">
            <a href="#" class="nav-link logout-link">
                Logout
            </a>
        </div>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Book Management</h1>
                <p>Add, update and remove library books</p>
            </div>

        </header>

        <div class="book-layout">

            <!-- Form -->
            <section class="content-card form-card">

                <h2 id="bookFormTitle">Add New Book</h2>

                <p class="form-description">
                    Enter the details of the book below.
                </p>

                <form id="bookForm">

                    <input type="hidden" id="bookId">

                    <div class="form-group">
                        <label for="bookTitle">Book Title</label>

                        <input
                            type="text"
                            id="bookTitle"
                            placeholder="Enter book title"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="bookAuthor">Author</label>

                        <input
                            type="text"
                            id="bookAuthor"
                            placeholder="Enter author"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="bookGenre">Genre</label>

                        <input
                            type="text"
                            id="bookGenre"
                            placeholder="e.g. Fiction"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="bookISBN">ISBN</label>

                        <input
                            type="text"
                            id="bookISBN"
                            placeholder="Enter ISBN"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="bookQuantity">Initial Quantity</label>

                        <input
                            type="number"
                            id="bookQuantity"
                            min="0"
                            placeholder="Enter quantity"
                            required
                        >
                    </div>

                    <div class="form-buttons">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="bookSubmitButton"
                        >
                            Add Book
                        </button>

                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="cancelBookEdit"
                            style="display:none;"
                        >
                            Cancel
                        </button>

                    </div>

                    <p id="bookMessage" class="message"></p>

                </form>

            </section>

            <!-- Book list -->
            <section class="content-card">

                <div class="section-header">

                    <div>
                        <h2>Library Books</h2>
                        <p>All books currently stored in the system</p>
                    </div>

                    <input
                        type="text"
                        id="bookSearch"
                        class="search-input"
                        placeholder="Search books..."
                    >

                </div>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Genre</th>
                                <th>ISBN</th>
                                <th>Quantity</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="bookTableBody">
                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
